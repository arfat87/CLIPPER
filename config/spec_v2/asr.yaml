version: 1
# Defaults are PROVISIONAL until the ASR bake-off (T-3.1b, ADR 0002) fills them with data.
device: auto            # auto|cuda|cpu
engines:
  faster_whisper:
    enabled: true
    models: { cuda: large-v3, cpu: medium }
    compute_type: { cuda: float16, cpu: int8 }
    beam_size: 5
    vad_filter: true
    condition_on_previous_text: false
    word_timestamps: true
    window_s: 30
    overlap_s: 5
  indic_specialist:          # slot for the bake-off winner (e.g. an Indic/Hinglish model); disabled until chosen
    enabled: false
    model_id: null
language_preference:         # first supported+enabled engine wins; owner can override per job
  en: [faster_whisper]
  hi: [indic_specialist, faster_whisper]
  hinglish: [indic_specialist, faster_whisper]
  bn: [indic_specialist, faster_whisper]
detection:
  windows: 3
  window_s: 30
  hinglish_latin_token_ratio: 0.25
alignment:
  enabled: true
  languages: [en, hi]
  fallback: engine_word_times
script_defaults: { en: latn, hi: deva, hinglish: latn, bn: beng }
hallucination_guard: { max_compression_ratio: 2.4, max_repeat_ngram: 4 }
low_conf_threshold: 0.3
