repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: secret-scan
        name: CLIPPER secret scanner
        entry: python3 scripts/secret_scan.py
        language: system
        types: [text]
      - id: mypy-hitl
        name: mypy (hitl & config)
        entry: .venv/bin/mypy hitl backend/app/config.py
        language: system
        pass_filenames: false
        types: [python]
