[project]
name = "clipper"
version = "0.1.0"
description = "Local-first AI Video Clipping & Multi-language Captioning Web Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "pysubs2>=1.7.3",
    "yt-dlp>=2024.10.0",
    "huey>=2.5.2",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "jsonschema>=4.23.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0.3",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "hitl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "hitl/tests"]
